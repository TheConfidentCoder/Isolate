name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release DMG
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build macOS Release Binary
        run: |
          xcodebuild -scheme Isolate -configuration Release -destination 'platform=macOS' build CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO -derivedDataPath DerivedData
          mkdir -p build/Release
          cp -R DerivedData/Build/Products/Release/Isolate.app build/Release/Isolate.app

      - name: Create DMG Disk Image
        run: |
          hdiutil create -volname "Isolate" -srcfolder build/Release/Isolate.app -ov -format UDZO Isolate.dmg

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Isolate.dmg
          generate_release_notes: true
          draft: false
          prerelease: false
